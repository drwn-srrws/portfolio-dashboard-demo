name: Deploy demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix backend
      - run: npm ci --prefix core/cloud-frontend
      - run: npm run build --prefix backend
      - run: npm run build --prefix core/cloud-frontend -- --mode pages
      - run: node backend/browser/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: core/cloud-frontend/dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
